name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Full Windows-buildable solution (WPF + tests need a Windows runner) ──
  # Uses MWC.ci.slnf, which excludes MWC.Platform.MacOS (net9.0-macos),
  # the only project that cannot build on windows-latest.
  windows:
    name: Windows · build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MWC.ci.slnf

      - name: Build (Release)
        run: dotnet build MWC.ci.slnf --configuration Release --no-restore

      - name: Test (Release)
        run: >
          dotnet test MWC.ci.slnf
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore

  # ── Platform-agnostic libraries on Linux (catches netstandard2.0 / Linux
  #    regressions early). The test project is net9.0-windows and references
  #    MWC.App (WPF), so tests run only on the Windows job above. ──
  linux:
    name: Linux · build (Core + Platform.Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build MWC.Core (Release)
        run: dotnet build src/MWC.Core/MWC.Core.csproj --configuration Release

      - name: Build MWC.Platform.Linux (Release)
        run: dotnet build src/MWC.Platform.Linux/MWC.Platform.Linux.csproj --configuration Release
