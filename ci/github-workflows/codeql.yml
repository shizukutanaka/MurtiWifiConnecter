name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "23 4 * * 1"   # weekly, Monday 04:23 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (csharp)
    # The full C# build (WPF, net9.0-windows) requires a Windows runner
    # for CodeQL to extract the database.
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build (Release)
        run: |
          dotnet restore MWC.ci.slnf
          dotnet build MWC.ci.slnf --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
