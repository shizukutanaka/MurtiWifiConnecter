name: CI

on:
  push:
    branches: [ main, master, 'claude/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── Windows: full build + test ──────────────────────────────────────────────
  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (Windows solution filter)
        run: dotnet restore MWC.ci-win.slnf

      - name: Build
        run: dotnet build MWC.ci-win.slnf -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/MWC.Core.Tests/MWC.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=TestResults/coverage.xml

      # SECURITY.md が「dotnet list package --vulnerable を CI で実行」と
      # 述べている根拠。既知の脆弱性を持つ依存が入ったらビルドを落とす。
      # --include-transitive が無いと直接参照しか見ないため必ず付ける。
      - name: Check for vulnerable dependencies
        shell: pwsh
        run: |
          $out = dotnet list MWC.ci-win.slnf package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') {
            Write-Error 'Vulnerable NuGet packages found (see the listing above).'
            exit 1
          }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults/

  # ── Ubuntu: Core-only build (no WPF, no tests) ─────────────────────────────
  build-linux:
    name: Build Core (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (Linux solution filter)
        run: dotnet restore MWC.ci-linux.slnf

      - name: Build
        run: dotnet build MWC.ci-linux.slnf -c Release --no-restore
