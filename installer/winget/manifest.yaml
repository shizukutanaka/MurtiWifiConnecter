ShortDescription: Multi-adapter Wi-Fi management tool for Windows
Description: |-
  MWC is a Windows-native Wi-Fi management tool supporting multiple wireless adapters.
  Features: WPA3-SAE, WPA2-Enterprise (PEAP/EAP-TLS), OWE, multi-adapter parallel scan,
  Wi-Fi QR code generation, captive portal detection, full keyboard accessibility.
