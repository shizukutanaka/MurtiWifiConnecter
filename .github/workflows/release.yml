name: Release

# タグ push で配布物を作り、SBOM・署名・provenance を付けて GitHub Release に出す。
#
# なぜ要るか:
#   README と SECURITY.md は長らく「Sigstore keyless signing」「SLSA provenance」
#   「リリース毎に CycloneDX SBOM 生成」と述べていたが、**リリースワークフローは
#   存在せず、リリースも 1 度も作られていない**。署名された配布物は 1 つも無い。
#   主張だけが先に存在していた状態で、これはセキュリティ文書としては最も避けたい形
#   (利用者が「検証済みの配布物がある」と誤認する)。
#   このワークフローがその主張を初めて真にする。
#
# 設置状態: 2026-11 に docs/ci/ からここへ設置した。**今後はこのファイルが正本**
#   (docs/ci/README.md の規約どおり、設置した側で保守する。docs/ci/ に複製は置かない)。
#   設置しただけでは何も起きない。`git tag v1.2.3 && git push --tags` で初めて走る。
#   workflow_dispatch は検証用で、成果物を Actions artifact として出すだけであり、
#   署名・provenance・Release 作成は行わない (タグ push のときだけ行う)。
#
# 配布物は zip と MSI (win-x64)。installer/wix/Product.wxs は当初 WiX **v5 以降**
#   でしか使えない `<Files Include="...">` ワイルドカードハーベストを使っており、
#   docs/adr/0005-multi-channel-distribution.md が明記する「WiX v4」と版数不一致
#   だった。2026-11 にハーベストを v4 で書ける明示的なファイル列挙へ置き換えた
#   (アプリは単一ファイル publish のため収録対象は MWC.exe のみ。詳細は
#   Product.wxs 自身のコメント参照)。MSI は win-x64 のみで、win-arm64 の MSI は
#   未対応 (zip は両 RID を出す)。署名・ハッシュ・provenance の各ステップは
#   *.msi も拾う書き方にしてある。
#
# 使う Action について:
#   actions/checkout・setup-dotnet・attest-build-provenance・upload-artifact は
#   GitHub 第一者。cosign のみ Sigstore プロジェクト公式の installer を使う
#   (keyless signing に他の入手経路が無いため)。バージョンはタグで固定する。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.3). Leave empty to build the selected branch as artifacts only.'
        required: false

permissions:
  contents: write        # Release の作成
  id-token: write        # Sigstore keyless / OIDC
  attestations: write    # SLSA provenance

jobs:
  release:
    name: Build, sign and publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version from the tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ("${{ github.event_name }}" -eq "push") { $tag = "${{ github.ref_name }}" }
          $version = $tag -replace '^v', ''
          # タグ無しの dispatch は検証用の成果物のみ。版数は開発用に倒し、
          # MSI の ProductVersion (数値 3 フィールド必須) には別途 0.0.0 を渡す。
          if (-not $tag) { $version = '0.0.0-dev' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          $msiVersion = if ($version -match '^\d+\.\d+\.\d+$') { $version } else { '0.0.0' }
          "msiversion=$msiVersion" >> $env:GITHUB_OUTPUT

      # 配布物を作る前にテストを通す。落ちた成果物に署名すると
      # 「署名されている = 検証された」という誤解を生むため、順序が重要。
      - name: Build and test
        run: |
          dotnet restore MWC.ci-win.slnf
          dotnet build MWC.ci-win.slnf -c Release --no-restore
          dotnet test tests/MWC.Core.Tests/MWC.Core.Tests.csproj -c Release --no-build

      - name: Publish (win-x64 / win-arm64)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/MWC.App/MWC.App.csproj `
              -c Release -r $rid --self-contained false `
              -p:Version=${{ steps.ver.outputs.version }} `
              -o "artifacts/$rid"
            Compress-Archive -Path "artifacts/$rid/*" `
              -DestinationPath "artifacts/MWC-${{ steps.ver.outputs.version }}-$rid.zip"
          }

      # MSI (win-x64 のみ)。Product.wxs は WiX v4 構文で書かれており、
      # ツールセットも ADR-0005 の決定どおり v4 系に固定する。
      # アプリは単一ファイル publish のため、収録対象は MWC.exe のみ
      # (installer/wix/Product.wxs のコメント参照)。
      #
      # ⚠ UI 拡張は 2 段構えが要る (2026-11 の初回 dispatch で実測):
      #   `wix extension add` は拡張をキャッシュへ**取得するだけ**で、
      #   `wix build` はそれを自動では読み込まない。読み込みには build 側の
      #   `-ext WixToolset.UI.wixext` が別途必要で、これが無いと
      #   Product.wxs の <ui:WixUI> が WIX0200 で落ちる。
      #   逆に `-ext` だけではキャッシュ未取得時に WIX0144 になるため、
      #   版数を固定する extension add も削れない。両方残すこと。
      - name: Build MSI (win-x64, WiX v4)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          & $wix extension add WixToolset.UI.wixext/4.0.6
          & $wix build installer/wix/Product.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d Version=${{ steps.ver.outputs.msiversion }} `
            -d AppPath=artifacts/win-x64 `
            -o "artifacts/MWC-${{ steps.ver.outputs.version }}-win-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }

      # SECURITY.md が「リリース毎に CycloneDX SBOM 生成」と述べている根拠。
      - name: Generate CycloneDX SBOM
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX MWC.ci-win.slnf -o artifacts -f sbom.json

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      # keyless signing: 鍵は保持せず、GitHub OIDC の身元で署名して
      # Rekor 透明性ログに記録する。検証は cosign verify-blob で行う。
      # 署名はリリース行為の一部なので、タグ push のときだけ行う。
      - name: Sign the artifacts (Sigstore keyless)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          Get-ChildItem artifacts -Include *.zip, *.msi -Recurse | ForEach-Object {
            cosign sign-blob --yes $_.FullName `
              --output-signature "$($_.FullName).sig" `
              --output-certificate "$($_.FullName).pem"
          }

      # SECURITY.md が「ハッシュは GitHub Releases に記載」と述べている根拠。
      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Include *.zip, *.msi -Recurse |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, $_.Name } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      # SLSA build provenance。GitHub 第一者の Action で、in-toto 形式の
      # 証明書を発行し Sigstore に記録する。これもタグ push のときだけ。
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.msi

      # 手動実行 (workflow_dispatch) では Release を作らない。パイプラインが
      # 通ることの確認と成果物の目視のため、artifact としてだけ出す。
      - name: Upload artifacts (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            artifacts/*.zip
            artifacts/*.msi
            artifacts/sbom.json
            artifacts/SHA256SUMS.txt

      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "See CHANGELOG.md for the changes in this release.

          Artifacts are signed with Sigstore keyless signing. Verify with:

              cosign verify-blob \\
                --certificate <file>.pem \\
                --signature   <file>.sig \\
                --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \\
                --certificate-oidc-issuer     'https://token.actions.githubusercontent.com' \\
                <file>" \
            artifacts/*.zip artifacts/*.msi artifacts/sbom.json artifacts/SHA256SUMS.txt \
            artifacts/*.sig artifacts/*.pem
